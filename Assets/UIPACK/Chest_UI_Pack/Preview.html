<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chest UI assembly preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#061226;color:white;font:700 16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(100%,480px);height:850px;position:relative;background:url('Reference/Home_Original.png') center/cover}main:before{content:'';position:absolute;inset:0;background:#0008;backdrop-filter:blur(3px)}section{position:absolute;top:29%;left:4%;width:92%;min-height:340px;background:linear-gradient(#0b2b5b,#071d42);border:2px solid #40bfff;border-radius:24px;padding:20px;box-shadow:0 3px 15px #0008}h1{margin:0 0 24px;font-size:25px}.close{position:absolute;right:18px;top:20px;width:26px;height:26px;cursor:pointer}.row{display:flex;align-items:start;gap:12px}.item{flex:1;text-align:center;min-width:0}.item img{width:100%;height:100px;object-fit:contain}.item small{display:block;color:#b8d9ff;margin:6px 0}.pill{border-radius:16px;padding:7px 2px;background:#52708a;font-size:13px}.ready{background:#68b900}.active{background:#05a7c5}button{display:block;cursor:pointer;border:0;background:#ffcc17;color:#062052;border-radius:22px;font:900 21px system-ui;padding:14px 22px;margin:20px auto 0;min-width:80%}button:disabled{opacity:.4}p{text-align:center;font-size:13px;color:#bddcff}.reveal{text-align:center}.reveal img{width:210px;height:210px;object-fit:contain}.cards img{height:145px}.coins{display:flex;justify-content:center;align-items:center;margin:0 0 18px}.coins img{height:36px;width:36px;object-fit:contain}.foot{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px}</style>
<main><section id="popup"></section><div class="foot">Layout demo · example timer and rewards · <a href="Reference/Chest_Selection.png" style="color:white">Approved reference</a></div></main>
<script>
const p=document.getElementById('popup');let selected='Silver',tick;
function header(t){return `<h1>${t}</h1><img class="close" src="Icons/Close.png" onclick="selection()" alt="Back to chest selection">`}
function selection(){clearInterval(tick);p.innerHTML=header('Your Chests')+`<div class="row">${['Silver','Gold','Master'].map((c,i)=>`<div class="item" onclick="choose('${c}')"><b>${c}</b><img src="Chests/${c}/${c}_Closed.png" alt="${c} chest"><small>◷ ${[4,8,24][i]}h</small><div class="pill ${['ready','active',''][i]}">${['Ready','02:35:10','Waiting'][i]}</div>${i===1?'<small>Unlocking</small>':''}</div>`).join('')}</div><p id="selected">Silver Chest selected</p><button id="open" onclick="opening()">OPEN CHEST</button>`;choose('Silver')}
function choose(c){selected=c;document.getElementById('selected').textContent=c+' Chest selected';document.getElementById('open').disabled=c!=='Silver'}
function opening(){let f=1;p.innerHTML=header('Silver Chest')+'<div class="reveal"><img id="chest" src="Chests/Silver/Animation_Frames/Silver_01.png" alt="Opening chest"></div><button id="reveal" disabled onclick="rewards()">Opening…</button>';tick=setInterval(()=>{f++;document.getElementById('chest').src='Chests/Silver/Animation_Frames/Silver_'+String(f).padStart(2,'0')+'.png';if(f===12){clearInterval(tick);let b=document.getElementById('reveal');b.disabled=false;b.textContent='Tap to reveal'}},85)}
function rewards(){p.innerHTML=header('Your Rewards')+'<div class="coins"><img src="Icons/Coin.png" alt="Coins"> +120 Coins</div><div class="row cards">'+[['Swordsman','Swordsman','x1'],['Archer','Archer','x1'],['Power_Card_Stack','Power Cards','x2']].map(a=>`<div class="item"><img src="Cards/${a[0]}.png" alt="${a[1]}"><small>${a[1]}</small>${a[2]}</div>`).join('')+'</div><button onclick="collected()">COLLECT</button>'}
function collected(){p.innerHTML=header('Rewards Collected')+'<p>Demo complete. No real game rewards were granted.</p><button onclick="selection()">REPLAY DEMO</button>'}selection();
</script>
